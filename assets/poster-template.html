<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门日报 McDoor Daily</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f0e6;
    display: flex; justify-content: center; padding: 20px 0;
  }
  .poster {
    width: 420px; max-width: 100%;
    /* 不要写死 aspect-ratio: 内容长度每天不同，锁死会裁掉底部区块 */
    background: linear-gradient(160deg, #ffbc0d 0%, #ff8a00 45%, #e23a2e 100%);
    border-radius: 24px; overflow: hidden; position: relative;
    display: flex; flex-direction: column; padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); color: #3a2400;
  }
  .grain { position:absolute; inset:0; opacity:.06; pointer-events:none;
    background-image: radial-gradient(#000 1px, transparent 1px); background-size: 6px 6px; }
  header { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-weight: 900; font-size: 22px; letter-spacing: 1px; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .date-chip { background: #fff; border-radius: 999px; padding: 5px 14px;
    font-size: 12px; font-weight: 700; color: #c0392b; }
  .fortune {
    position: relative; margin-top: 18px; background: #fffdf7;
    border-radius: 18px; padding: 20px; text-align: center;
    box-shadow: 0 6px 0 rgba(0,0,0,.08);
  }
  .fortune .level { font-size: 40px; font-weight: 900; letter-spacing: 6px; }
  .fortune .level.lucky { color: #c0392b; } .fortune .level.small { color: #e67e22; }
  .fortune .level.normal { color: #7f8c3a; } .fortune .level.bad { color: #2c3e50; }
  .fortune .quote { margin-top: 8px; font-size: 15px; font-weight: 700; }
  .fortune .jiejie { margin-top: 6px; font-size: 12px; color: #8a6d3b; line-height: 1.6; }
  .yy { display: flex; gap: 10px; margin-top: 12px; }
  .yy div { flex: 1; border-radius: 12px; padding: 10px; font-size: 12px; line-height: 1.7; }
  .yi { background: #eaf7ea; color: #256029; } .ji { background: #fdecea; color: #922b21; }
  .yy b { display: block; font-size: 13px; margin-bottom: 2px; }
  .section { position: relative; margin-top: 14px; background: rgba(255,255,255,.94);
    border-radius: 16px; padding: 14px 16px; }
  .section h2 { font-size: 14px; font-weight: 900; color: #c0392b; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px; }
  .act { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
  .act:last-child { margin-bottom: 0; }
  .act img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; flex-shrink: 0;
    background: #f0e6d2; }
  .act .t { font-size: 13px; font-weight: 800; line-height: 1.4; }
  .act .d { font-size: 11px; color: #7a6a50; margin-top: 2px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .coupon-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .coupon-chip { background: #fff3d6; border: 1px dashed #e0a800; color: #8a5a00;
    font-size: 11px; font-weight: 700; border-radius: 999px; padding: 4px 10px; }
  .coupon-chip.warn { background: #fdecea; border-color: #e74c3c; color: #c0392b; }
  .radar { font-size: 11.5px; color: #5d4a26; line-height: 1.8; }
  .radar b { color: #c0392b; }
  footer { position: relative; margin-top: 14px; text-align: center; color: #fff;
    font-size: 11px; opacity: .92; line-height: 1.6; }
  footer .mm { font-size: 16px; font-weight: 900; letter-spacing: 4px; }
  .hero { position: relative; margin-top: 16px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 6px 0 rgba(0,0,0,.08); }
  .hero img { width: 100%; display: block; height: 160px; object-fit: cover; }
  .hero .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.65)); color: #fff;
    font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
<div class="poster">
  <div class="grain"></div>
  <header>
    <div class="brand">🍟 麦门日报</div>
    <div class="date-chip"><!-- DATA:DATE --></div>
  </header>

  <div class="fortune">
    <div class="level lucky"><!-- DATA:FORTUNE_LEVEL --></div>
    <div class="quote"><!-- DATA:FORTUNE_QUOTE --></div>
    <div class="jiejie"><!-- DATA:FORTUNE_JIE --></div>
    <div class="yy">
      <div class="yi"><b>✅ 宜</b><!-- DATA:YI --></div>
      <div class="ji"><b>🚫 忌</b><!-- DATA:JI --></div>
    </div>
  </div>

  <div class="section">
    <h2>📰 今日麦门情报</h2>
    <!-- DATA:ACTIVITIES -->
  </div>

  <div class="section">
    <h2>🎫 卡包羊毛</h2>
    <div class="coupon-row"><!-- DATA:COUPONS --></div>
  </div>

  <div class="section" style="background:rgba(255,243,214,.95)">
    <h2 style="color:#8a5a00">📡 羊毛雷达</h2>
    <div class="radar"><!-- DATA:RADAR --></div>
  </div>

  <footer>
    <div class="mm">麦 门 !</div>
    数据来源：麦当劳中国 MCP · 仅供娱乐与参考 · 以 App 实际为准
  </footer>
</div>
</body>
</html>
